[project]
name = "atlas"
version = "0.2.0"
description = "ATLAS AI Investment Platform"
requires-python = ">=3.12"
dependencies = [
    "python-multipart>=0.0.32",
    "yfinance>=0.2.66",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
