<section class="card analysis-card" data-watchlist>
    <div class="watchlist-header">
        <div>
            <h2>⭐ Min Watchlist</h2>
            <p class="watchlist-subtitle">Dine valgte instrumenter — ikke Scannerens kandidater.</p>
        </div>
    </div>

    <div class="watchlist-add">
        <input data-watchlist-input type="text" placeholder="Skriv symbol, f.eks. BTC-USD eller AAPL" autocomplete="off">
        <button data-watchlist-add type="button">＋ Legg til</button>
    </div>

    <table>
        <thead>
            <tr><th>Symbol</th><th>Status</th><th></th></tr>
        </thead>
        <tbody data-watchlist-list></tbody>
    </table>
</section>
