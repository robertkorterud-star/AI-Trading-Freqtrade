<!DOCTYPE html>
<html lang="{{ get_language() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/overview.css">
    <script src="/static/market_enhancements.js"></script>
    <script src="/static/market_terminal_fix.js"></script>
    <script src="/static/watchlist_ui.js"></script>
</head>
<body>
<div class="container">
    {% include "components/navbar.html" %}
    {% include "components/status_bar.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        ATLAS v0.8.1
        <span id="atlas-refresh-status">
            {% if request and request.url.path == "/scanner" %}
                · {{ t("manual_refresh") }}
            {% else %}
                · {{ t("live_refresh") }}: 30s
            {% endif %}
        </span>
    </footer>
</div>
<script>
(function () {
    if (window.location.pathname === "/scanner") return;
    const selected = new URLSearchParams(window.location.search).get("symbol");
    if (selected) localStorage.setItem("atlas.last_market_search", selected);
})();
</script>
<script>
(function () {
    if (window.location.pathname === "/scanner") return;
    const REFRESH_MS = 30000;
    let countdown = REFRESH_MS / 1000;
    const status = document.getElementById("atlas-refresh-status");
    const timer = window.setInterval(function () {
        countdown -= 1;
        if (status) status.textContent = " · {{ t('live_refresh') }}: " + countdown + "s";
        if (countdown <= 0) {
            window.clearInterval(timer);
            if (window.location.pathname.startsWith("/market/")) return;
            window.location.reload();
        }
    }, 1000);
})();
</script>
</body>
</html>
