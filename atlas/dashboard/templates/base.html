<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATLAS</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <!-- =======================
         TOP BAR
    ======================== -->

    <header class="topbar">

        <div class="logo">

            🚀 <span>ATLAS</span>

        </div>

        <nav class="menu">

            <a href="/">Dashboard</a>
            <a href="/analysis">Analysis</a>
            <a href="/markets">Markets</a>
            <a href="/portfolio">Portfolio</a>
            <a href="/agents">Agents</a>

        </nav>

        <div class="top-right">

            <!-- Currency selector (frontend for now) -->

            <select class="currency-select">

                <option selected>🇺🇸 USD</option>
                <option>🇳🇴 NOK</option>
                <option>🇪🇺 EUR</option>
                <option>🇸🇪 SEK</option>

            </select>

            <div class="status">

                <div class="status-dot"></div>

                {{ dashboard.status }}

            </div>

        </div>

    </header>

    <!-- =======================
         PAGE CONTENT
    ======================== -->

    {% block content %}

    {% endblock %}

    <!-- =======================
         FOOTER
    ======================== -->

    <footer>

        <p>

            ATLAS {{ dashboard.version }}

        </p>

    </footer>

</div>

</body>

</html>
