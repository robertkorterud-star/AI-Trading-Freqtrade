<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATLAS</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container">

    {% include "components/navbar.html" %}

    {% include "components/status_bar.html" %}

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        ATLAS v0.8.1
        <span id="atlas-refresh-status">
            {% if request and request.url.path == "/scanner" %}
                · Scanner refresh: manual
            {% else %}
                · Live refresh: 30s
            {% endif %}
        </span>
    </footer>

</div>

<script>
(function () {
    /*
     * ATLAS live refresh:
     * the Scanner page is intentionally excluded because its local
     * filters/search state must not be destroyed by a full page reload.
     */

    if (window.location.pathname === "/scanner") {
        return;
    }

    const REFRESH_MS = 30000;

    let countdown = REFRESH_MS / 1000;
    const status = document.getElementById("atlas-refresh-status");

    const timer = window.setInterval(function () {

        countdown -= 1;

        if (status) {
            status.textContent =
                " · Live refresh: " + countdown + "s";
        }

        if (countdown <= 0) {

            window.clearInterval(timer);

            if (
                window.location.pathname.startsWith(
                    "/market/"
                )
            ) {
                return;
            }

            window.location.reload();
        }

    }, 1000);

})();
</script>

</body>

</html>
