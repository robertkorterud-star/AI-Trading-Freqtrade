<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATLAS</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container">

    {% include "components/navbar.html" %}

    {% include "components/status_bar.html" %}

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        ATLAS v0.8.1
        <span id="atlas-refresh-status">
            · Live refresh: 30s
        </span>
    </footer>

</div>

<script>
(function () {
    /*
     * ATLAS live refresh:
     * reloads the current dashboard every 30 seconds.
     * The current ?symbol=... URL is preserved automatically,
     * so the selected asset remains selected.
     *
     * Favorites are stored in localStorage by watchlist.html
     * and therefore also survive the refresh.
     */

    const REFRESH_MS = 30000;

    let countdown = REFRESH_MS / 1000;
    const status = document.getElementById("atlas-refresh-status");

    const timer = window.setInterval(function () {

        countdown -= 1;

        if (status) {
            status.textContent =
                " · Live refresh: " + countdown + "s";
        }

        if (countdown <= 0) {

            window.clearInterval(timer);

            if (
                window.location.pathname.startsWith(
                    "/market/"
                )
            ) {
                return;
            }

            window.location.reload();
        }

    }, 1000);

})();
</script>

</body>

</html>
