<!DOCTYPE html>
<html lang="{{ get_language() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/overview.css">
    <script src="/static/market_enhancements.js"></script>
    <script src="/static/market_terminal_fix.js"></script>
    <script src="/static/watchlist_ui.js"></script>
</head>
<body>
<div class="container">
    {% include "components/navbar.html" %}
    {% include "components/status_bar.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        ATLAS v0.8.1
        <span id="atlas-refresh-status">
            {% if request and request.url.path == "/scanner" %}
                · {{ t("manual_refresh") }}
            {% else %}
                · {{ t("live_events") }}
            {% endif %}
        </span>
    </footer>
</div>
<script>
(function () {
    if (window.location.pathname === "/scanner") return;
    const selected = new URLSearchParams(window.location.search).get("symbol");
    if (selected) localStorage.setItem("atlas.last_market_search", selected);
})();
</script>
<script>
(function () {
    if (window.location.pathname !== "/") return;
    if (!window.EventSource) return;

    const status = document.getElementById("atlas-refresh-status");
    const source = new EventSource("/api/atlas-events");

    source.onopen = function () {
        if (status) status.textContent = " · {{ t('live_events') }}: connected";
    };

    source.onmessage = function () {
        window.location.reload();
    };

    ["DECISION_READY", "TRADE_EXECUTED", "LEARNING_UPDATED"].forEach(function (eventName) {
        source.addEventListener(eventName, function () {
            window.location.reload();
        });
    });

    source.onerror = function () {
        if (status) status.textContent = " · {{ t('live_events') }}: reconnecting";
    };
})();
</script>
</body>
</html>
